[package]
name = "emblize"
version = "0.1.0"
edition = "2024"

[dependencies]
heapless = "0.9.2"
num_enum = { version = "0.7.5", default-features = false }
serde = { version = "1.0.219", features = ["derive"], default-features = false }
thiserror = { version = "2.0.17", default-features = false }

[features]
default = []
alloc = ["serde/std", "thiserror/std"]
std = ["alloc"]
frame = []